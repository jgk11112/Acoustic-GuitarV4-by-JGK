name: Build Acoustic Guitar by JGK V4

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release

      - name: Upload full plugin
        uses: actions/upload-artifact@v4
        with:
          name: Acoustic-Guitar-by-JGK-V4
          path: build/AcousticGuitarByJGK_artefacts/Release/**
